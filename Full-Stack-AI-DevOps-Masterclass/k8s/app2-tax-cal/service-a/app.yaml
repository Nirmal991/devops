apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
        - name: myapp
          image: nginx
          env: 
            - name: APP_NAME
              value: "Hello from app.yaml"
            - name: DB_PASS
              value: "asdroinweo-wi223in"
          ports:
            - containerPort: 80