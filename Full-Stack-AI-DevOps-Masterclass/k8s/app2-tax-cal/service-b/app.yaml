apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-b
spec:
  replicas: 2
  selector:
    matchLabels:
      app: service-b
  template:
    metadata:
      labels:
        app: service-b
    spec:
      containers:
        - name: service-b
          image: nginx
          env: 
            - name: APP_NAME
              value: "Hello from app.yaml"
            - name: DB_PASS
              value: "asdroinweo-wi223in"
          ports:
            - containerPort: 80

--- 
apiVersion: v1
kind: Service
metadata:
  name: service-b
spec:
  selector:
    app: service-b
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 32000 